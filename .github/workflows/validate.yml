name: Validate pi-brain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pi-brain (pinned to clone template version)
        run: npm install --no-save @misabegovic/pi-brain@0.4.0

      - name: Validate corpus and regenerate views
        run: node node_modules/@misabegovic/pi-brain/tools/brain-sync.mjs
