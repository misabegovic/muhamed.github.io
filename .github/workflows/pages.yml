name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Fired by misabegovic/izbori2026 when the voter guide changes, so the copy
  # mounted at /politika/analiza-izbora/ is rebuilt without a site commit.
  repository_dispatch:
    types: [izbori-update]
  # Safety net: the guide is regenerated from committed data, so a daily
  # rebuild keeps it fresh even when no dispatch arrives.
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  IZBORI_REPO: misabegovic/izbori2026
  IZBORI_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout izbori2026 voter guide
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IZBORI_REPO }}
          ref: ${{ env.IZBORI_REF }}
          path: izbori2026

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: files

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        working-directory: files
        env:
          JEKYLL_ENV: production

      - name: Mount voter guide at /politika/analiza-izbora/
        run: ./.github/scripts/build-analiza-izbora.sh izbori2026 files/_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: files/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
