# The Rails offer: the /rails/ page and the band under the services on the
# homepage. The name, format and summary are the Rails entry in home.yml
# (services:); the email is in services.yml (details: Rails). Every claim
# carries its evidence id from the store in ~/projects/hireable, or says it is
# on the owner's word.

kicker: Ruby on Rails consulting
# Widened from "For Rails apps that outgrew their first design." when the
# menu came to span the whole lifecycle (owner, 2026-10-26).
title: Rails apps, from the first release to the tenth year.
# evidence: role-experfy (joined 2016), role-teamtailor-employer, proj-usput-web
# No customer counts for clients (owner, 2026-10-26: not too much bragging).
lead: >-
  I have written Ruby since 2016 and shipped Rails in production for most of
  that time, in mature products with many teams on one codebase and in my own
  products on Rails 8.

# Why a Rubyist, in four facts anyone can check.
# evidence: role-experfy, community-rubyconf-austria, community-euruko-2024, oss-enola-gems
facts:
  - { value: "2016", label: "writing Ruby since" }
  - { value: RubyConf Austria, label: "founded and organised, 2026" }
  - { value: EuRuKo 2024, label: "organised, 700 attendees" }
  - { value: "4 gems", label: "maintained on rubygems.org" }

# What I do on Rails apps: the kinds of work buyers look for, in the owner's
# terms (2026-10-26: "shipping behind feature flags, refactoring, rewrites,
# maintenance of old Ruby/Rails projects... managing the entire lifecycle end
# to end", then "introducing and optimizing processes... improving CI/CD
# practices... continous delivery with trunk based deployments"). Eight, so
# the grid stays two rows of four. No proof section (owner: "seems a bit
# weak"); the facts and the recommendation carry it.
work_title: What I do on Rails apps.
work:
  - name: Maintenance and upgrades
    text: Keep an older Ruby or Rails app healthy and current, with upgrades in steps your team can ship, security fixes, and the bugs nobody has had time for.
  # "Rails best practices" folded in here (owner, 2026-10-26).
  - name: Refactoring
    text: Untangle the parts every change has to touch and bring the code back to Rails conventions, so anyone on the team can find their way around, while features keep shipping.
  - name: Rewrites
    text: When a rewrite is the right call, done piece by piece beside the running app, not as a big bang.
  - name: Performance
    text: Slow pages and backed-up job queues, fixed in the order your users feel them.
  # evidence: role-carv-devops, role-meisterlabs-kubernetes; trunk-based
  # development and feature flags on the owner's word (2026-10-26)
  - name: CI/CD and continuous delivery
    text: Pipelines your team trusts, trunk-based development with small daily merges, and new work behind feature flags, switched off without a deploy.
  # evidence: role-experfy-scaleup, role-carv-devops
  - name: Team processes
    text: Introduce and tune how your team plans, reviews and ships, so work flows instead of waiting.
  # evidence: role-teamtailor-ownership, proj-usput-live
  # Was "End to end", which read oddly on its own (owner, 2026-10-26).
  - name: New features, idea to production
    text: "One person who owns a new feature or product through its whole lifecycle: the idea, the spec, the build, the rollout and running it."
  # evidence: role-teamtailor-ownership, role-teamtailor-langfuse, proj-usput-retrieval-grounding
  - name: AI features
    text: AI inside your Rails app, grounded in your data and measured with evals, without a second stack.

# Ways to start, smallest first. Drafts for the owner: no prices, no capacity
# promise (owner, 2026-10-26: always invite people to write).
formats:
  title: How we can work.
  items:
    - { name: A call, text: "One question, talked through with someone who has seen it before. You get my notes afterwards." }
    - { name: A day in your code, text: "We work through the problem in your codebase together. You get a written plan your team can act on." }
    - { name: Ongoing, text: "A few hours a month as your team's Rails advisor, for reviews, decisions and the hard parts." }
  more: Bigger than that? I also build, lead teams and review architecture.
  # The owner's words (2026-10-26): "I will let them know then... I can also
  # recommend someone if I am not available".
  booked: Write even if you are not sure the timing works. If I am booked, I will say so, and point you to someone good.

community:
  title: A Rubyist, in the community too.
  items:
    # evidence: community-rubyconf-austria, community-rubyconf-speakers
    - "Founded and organised <strong>RubyConf Austria 2026</strong> in Vienna, with Dave Thomas, Chad Fowler, José Valim and Armin Ronacher on the programme."
    # evidence: community-euruko-2024
    - "Organised <strong>EuRuKo 2024</strong> in Sarajevo, Europe's longest-running Ruby conference: 700 attendees and 50 speakers from 25+ countries."
    # evidence: oss-enola-gems
    - "Maintain four Ruby gems, <a href=\"https://rubygems.org/gems/enola-rb\">enola-rb</a> for Rails teams among them, and open-sourced <a href=\"https://github.com/Ruby-Austria/treasure_hunt\">treasure_hunt</a>, a Rails 8.1 app."
  logos: [rubyconf-austria, euruko]

# From Zlatko's recommendation (home.yml testimonials: zlatko), word for word.
quote:
  by: zlatko
  text: >-
    He is a strong Ruby on Rails engineer and a natural architect. He took on
    leading the technical direction and shaping the code, and his decisions
    held up as the project grew. … I recommend him to any team that needs a
    Rails engineer who can lead.
  short: I recommend him to any team that needs a Rails engineer who can lead.

closing:
  title: Tell me about your Rails app.
  text: A few lines is enough. If I am not the right person, or not free, I will tell you, and point you to someone who is.
