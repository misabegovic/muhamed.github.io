      agent-written knowledge that cannot promote itself. Published on npm, nine tagged releases.
  - name: tabula
    role: In private development
    url: ""
    # evidence: not yet in the evidence store
    text: >-
      Shared memory for teams of agents and people, written in Rust: files and
      git as the truth, claims as leases so agents never collide, an append-only
      journal of who did what, and the decisions that belong to people refused
      by the tool itself.

