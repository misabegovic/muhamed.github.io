services:
  - number: "01"
    name: Build
    fits: When you need a product or feature built.
    format: Embedded, part-time or full-time
    title: Hands-on product engineering
    # evidence: role-teamtailor-copilot, role-meisterlabs-permissions, proj-usput-web
    text: >-
      I join your team as a senior engineer and build the product or feature
      end to end, from spec to production.
  - number: "02"
    name: Lead
    fits: When your team needs technical direction.
    format: Part-time or full-time
    title: Technical lead for your team
    # evidence: role-carv-team, role-experfy-team
    text: >-
      I lead your engineering team, part-time or full-time: technical
      direction, architecture, delivery, and the people.
  - number: "03"
    name: Review
    fits: When you want to know where your system stands.
    format: Fixed scope, one to two weeks
    title: Architecture review
    # evidence: skill-software-design, role-carv-ats-integrations, oss-enola-constraints
    text: >-
      A short, fixed-scope look at your codebase and system: what holds, what
      will break, and what to fix first.
  - number: "04"
    name: AI-native
    fits: When you want your company to build with AI.
    format: Workshops, then setup in your codebase
    title: Make your company AI-native
    # evidence: oss-brain, oss-pi-brain, proj-tabula, oss-enola-constraints, oss-enola-gems, role-teamtailor-copilot, proj-usput-retrieval-grounding
    text: >-
      How you build and what you build. I set up a knowledge base your people
      and agents work from, with architecture rules checked in CI, and build
      AI features into your product that hold up in production, using
      open-source tools I build and teach.

