open_source:
  # The owner's main tools first: enola, tabula and taha (2026-10-22).
  - name: enola
    role: Core contributor
    url: https://github.com/enola-labs/enola
    profile: /projects/enola/
    outcome: Catches architecture drift in CI, so agent-written code keeps to the rules your team agreed on.
    # evidence: oss-enola-constraints
    text: >-
      Architectural regression testing for AI-assisted development. I built the
      constraints program: architectural laws declared over the code graph,
      checked deterministically in CI, with a Ruby DSL, and the gems that bring
      it to Rails teams, enola-guides among them.
  # evidence: not yet in the evidence store; intent in the owner's private
  # brain (wiki/tabula), refreshed 2026-10-22.
  - name: tabula
    role: In private development · coming soon
    url: ""
    profile: /projects/tabula/
    thumb: /images/projects/tabula/thumb
    outcome: Understand a system you inherited, write down what it should become, and hold every agent to it.
    text: >-
      A single Rust tool that keeps a project's memory, decisions and contract
      as plain files git carries. Agents claim work on leases, every act is
      journaled, and finished work is judged against its stated outcomes by
      something other than the agent that did it. Steps that belong to a
      person are refused to the agent.
  # evidence: not yet in the evidence store; intent in the owner's private
  # brain (wiki/tabula-harness), 2026-10-22.
  - name: taha
    role: The tabula harness · coming soon
    url: ""
    profile: /projects/taha/
    thumb: /images/projects/taha/thumb
    outcome: Lets a coding agent work unattended inside a mandate and come back with finished, checked work you can trust.
    text: >-
      A durable host on pi and Pi Durable: a killed run resumes without
      repeating anything. tabula holds the intent, the journal and the gates;
      every outward act is journaled first, pull requests stay drafts unless
      you grant a merge on your own private repository, and the agent's shell
      holds no credentials.
  # evidence: oss-enola-gems; https://rubygems.org/gems/enola-guides; misabegovic/enola-guides README
  - name: enola-guides
    role: Author and maintainer
    url: https://github.com/misabegovic/enola-guides
    profile: /projects/enola-guides/
    outcome: Shows a team how to work this way, with decisions anchored to code, laws in CI, and agents that read before they write.
    text: >-
      A Ruby gem of guides, a catalogue of 26 architecture laws, worked
      examples, agent skills and hooks, for teams adopting enola. Eight
      releases on rubygems.org since August 2026.
  - name: pi-brain
    role: Author and maintainer
    url: https://github.com/misabegovic/pi-brain
    profile: /projects/pi-brain/
    outcome: Makes agents read your decisions before they edit, and keeps a person in charge of what they learn.
    # evidence: oss-pi-brain*
    text: >-
      An intent store for agentic development on the pi harness: human-gated
      agent workflows, decision records agents must read before editing, and
      agent-written knowledge that cannot promote itself. Published on npm, nine tagged releases.
  # evidence: oss-brain; misabegovic/brain README
  - name: brain
    role: Author
    url: https://github.com/misabegovic/brain
    profile: /projects/brain/
    outcome: Gives people and agents one record of what was decided and why, kept current by the agent.
    text: >-
      A knowledge base your coding agent maintains: sources go in unchanged,
      the agent keeps a wiki where every claim cites its source, and specs and
      decision records sit next to the code. The method behind my agentic
      SDLC work, and where pi-brain started.

