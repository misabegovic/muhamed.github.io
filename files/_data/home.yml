# The work page, by capability. Proof points name no employer, no client and no
# date, and link only to public work. Each carries its evidence ids.
capabilities:
  - id: ai-in-production
    title: AI features that hold up in production.
    text: >-
      Model output is treated as input to be checked, not an answer to be
      trusted: retrieval grounds it, schemas shape it, evals measure it.
    proofs:
      # evidence: role-teamtailor-ownership, role-teamtailor-screening-triggers, role-teamtailor-request-missing-info, role-teamtailor-smart-move
      - "AI screening in a hiring product used by 8,500+ companies, owned from pitch to rollout and measurement, and shipped to every customer of its AI add-on: screening at any stage, candidates moved on the outcome, and questionnaires that ask candidates for what their application is missing."
      # evidence: role-teamtailor-langfuse
      - Prompts moved into Langfuse, with datasets, LLM judges and live scoring on production traffic, and A/B experiments of prompt and model versions that promoted the winners.
      # evidence: proj-usput-retrieval-grounding, proj-usput-live
      - A travel guide with thousands of visits a month, whose place descriptions, audio-tour scripts and itineraries are written from real place data, not from the model's memory.
      # evidence: role-teamtailor-prescreening, role-teamtailor-prescreening-retrieval
      - A retrieval-augmented candidate-screening design for a regulated hiring context, with separate parse, extract, embed, retrieve and evaluate stages, embeddings kept apart per customer, and evaluation tooling, designed with the EU AI Act in mind.
      # evidence: proj-usput-ai-layer
      - A production LLM layer with schema-enforced structured output, layered retries, JSON repair and versioned prompts.
      # evidence: skill-ai-llm-engineering
      - Prompt-injection screening and deterministic pre-filters in front of model calls.
    links:
      - { label: usput.ba, url: "https://usput.ba" }
  - id: guardrails
    title: Guardrails for agent-written code.
    text: >-
      Agents write most of the code now. What keeps it honest is written down
      and checked by machines: specs, decision records and architectural laws.
    proofs:
      # evidence: oss-enola-constraints
      - The constraints program in enola, architectural laws declared over the code graph and checked deterministically in CI, with a Ruby DSL and four gems for Rails teams.
      # evidence: oss-pi-brain, oss-pi-brain-gating
      - pi-brain, an intent store for agentic development with human-gated workflows and decision records agents must read before they edit.
      # evidence: proj-card-game-adrs, skill-spec-driven-development
      - Spec-driven projects where decision records are checked against the code by a pre-push hook.
      # evidence: skill-mcp
      - Three MCP servers, in Go, Rails and plain Ruby.
    links:
      - { label: enola, url: "https://github.com/enola-labs/enola" }
      - { label: pi-brain, url: "https://github.com/misabegovic/pi-brain" }
  - id: one-model
    title: Many systems, one model.
    text: >-
      Most products sit on top of other people's data. The work is making it
      one shape, early, so everything downstream stays simple.
    proofs:
      # evidence: role-carv-integration-lead
      - "Merged two products after an acquisition: one frontend, one database for clients and sessions, and two stacks brought step by step closer."
      # evidence: role-carv-ats-integrations, role-carv-channel-normalisation
      - Normalised data from 20+ applicant tracking systems into one model, so AI features worked the same for every client and a new integration needed no new code elsewhere.
      - A dynamic plans and permissions system across three apps, replacing hardcoded feature checks so product could run billing experiments without developer time.
      # evidence: role-carv-event-system
      - Part of the team that built an event system on Redis Pub/Sub, with every event defined once and kept normalised across the product.
      # evidence: proj-market-analysis, proj-market-analysis-scale
      - A daily job-market pipeline over 4.76 million postings, reading only the columns it needs with DuckDB.
      # evidence: role-carv-devops, skill-kubernetes
      - DevOps and CI/CD on Google Cloud, and separate frontend and backend deploy pipelines on Kubernetes so a frontend team shipped daily on its own.
  - id: teams
    title: Leading teams.
    text: >-
      Good teams make their own decisions well. My job is to make the
      decisions visible, the work small, and the blockers short-lived.
    proofs:
      # evidence: role-experfy-team, role-experfy-scaleup, role-experfy-direction
      - Set the product and technical direction for an ATS and led around 30 engineers across backend, frontend and DevOps, fully remote over 7 time zones, through 150 percent growth without missing a deadline.
      # evidence: role-carv-team, role-carv-integration-lead; recommendation zlatko
      - 'Tech lead for a team of 10 at a seed-stage AI startup, through its acquisition and the merger of both products, owning delivery with a PM and leading by building.'
      # evidence: community-euruko-2024
      - Ran a 700-attendee European Ruby conference end to end, with 50 speakers and a small volunteer team.
      # evidence: community-bhff, cert-bhff-excellence
      - Three years as a volunteer mentor and team lead for students, with two Certificates of Excellence.

open_source:
