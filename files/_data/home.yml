# The work page, by capability. Proof points name no employer, no client and no
# date, and link only to public work. Each carries its evidence ids.
capabilities:
  - id: ai-in-production
    title: AI features that hold up in production.
    text: >-
      You get AI features your customers can rely on: grounded in your data,
      measured once they ship, and easy to improve.
    proofs:
      # evidence: role-teamtailor-ownership, role-teamtailor-employer, role-teamtailor-screening-triggers
      - Shipped AI features to every customer of a hiring product used by 8,500+ companies, from the first pitch to measuring the results.
      # evidence: role-teamtailor-langfuse
      - Set up prompt management, evals and A/B experiments, so the team improved AI features with data instead of guesses.
      # evidence: proj-usput-live, proj-usput-retrieval-grounding
      - Run my own AI product, where I try new ideas on real users first.
    links:
      - { label: usput.ba, url: "https://usput.ba" }
  - id: guardrails
    title: Teams that use coding agents safely.
    text: >-
      You get a team that ships faster with AI agents, with specs, decisions
      and architecture rules that keep the code in shape.
    proofs:
      # evidence: oss-enola-constraints, oss-enola-gems, oss-pi-brain, oss-brain
      - Built the open-source tools I teach with, used to keep agent-written code aligned with its specs and architecture.
      # evidence: skill-spec-driven-development, proj-card-game-adrs
      - Set up spec-driven workflows where decisions are written down and checked against the code before it ships.
    links:
      - { label: enola, url: "https://github.com/enola-labs/enola" }
      - { label: pi-brain, url: "https://github.com/misabegovic/pi-brain" }
  - id: one-model
    title: Systems that stay simple as they grow.
    text: >-
      You get an architecture your team can keep building on: one clear model
      of your data, and integrations that don't leak everywhere.
    proofs:
      # evidence: role-carv-integration-lead
      - "Led the integration of two products after an acquisition: one frontend, one shared database, and the two stacks brought step by step closer."
      # evidence: role-carv-ats-integrations
      - Brought data from 20+ outside systems into one model, so new integrations stopped costing new work elsewhere.
      # evidence: role-meisterlabs-permissions
      - Designed a plans and permissions system that let product run billing experiments without developer time.
  - id: teams
    title: Leading teams that deliver.
    text: >-
      You get a team that knows where it is going and ships on time.
    proofs:
      # evidence: role-experfy-team, role-experfy-scaleup
      - Led around 30 engineers across 7 time zones through 150 percent growth, without missing a deadline.
      # evidence: role-carv-team
      - Led a team of 10 at a startup through its acquisition, leading by building.

open_source:
  - name: enola
    role: Core contributor
    url: https://github.com/enola-labs/enola
    # evidence: oss-enola-constraints
    text: >-
      Architectural regression testing for AI-assisted development. I built the
      constraints program: architectural laws declared over the code graph,
      checked deterministically in CI, with a Ruby DSL and four gems for Rails
      teams.
  - name: pi-brain
    role: Author and maintainer
    url: https://github.com/misabegovic/pi-brain
    # evidence: oss-pi-brain*
    text: >-
      An intent store for agentic development on the pi harness: human-gated
      agent workflows, decision records agents must read before editing, and
      agent-written knowledge that cannot promote itself. Published on npm, nine tagged releases.
  - name: tabula
    role: In private development
    url: ""
    # evidence: not yet in the evidence store
    text: >-
      Shared memory for teams of agents and people, written in Rust: files and
      git as the truth, claims as leases so agents never collide, an append-only
      journal of who did what, and the decisions that belong to people refused
      by the tool itself.

