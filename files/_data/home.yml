  # Recommendation received 2026-09-28, pasted by the owner.
  - id: zlatko
    quote: >-
      Muhamed leads by doing. When we hit a hard problem, he didn't start with
      a long discussion. He wrote the code, showed it working, and then we
      talked. That habit moved the team forward more than once.
    full: >-
      I worked with Muhamed on the same team for a year, and he quickly became
      one of the people I relied on most. Muhamed leads by doing. When we hit a
      hard problem, he didn't start with a long discussion. He wrote the code,
      showed it working, and then we talked. That habit moved the team forward
      more than once. He is a strong Ruby on Rails engineer and a natural
      architect. He took on leading the technical direction and shaping the
      code, and his decisions held up as the project grew. No challenge was too
      big or too unfamiliar for him. He is resourceful and knowledgeable, and
      when the answer wasn't obvious, he knew where to look. He is precise and
      professional, and he holds a high bar. He is also direct. When something
      wasn't good enough, he said so plainly, even when that was hard to hear.
      It was always about the work and never about the person, and it made
      both our code and our team better. I would gladly work with Muhamed
      again, and I recommend him to any team that needs a Rails engineer who
      can lead.
    name: Zlatko Alomerovic
    url: https://www.linkedin.com/in/zlatkoalomerovic/
    initials: ZA
    avatar: /images/testimonials/zlatko.webp
    role: Worked with Muhamed at Recrubo/Carv
  # LinkedIn recommendation, 2021-07-20. quote is the short version shown
