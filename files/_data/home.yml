# Things the owner made. Link when public; mark private when not.
side_projects:
  - id: usput
    name: Usput.ba
    note: AI Engineer, my own product
    logo: /images/logos/usput.webp
    url: https://usput.ba
    link_label: Visit usput.ba
    profile: /projects/usput/
    # evidence: proj-usput-web, proj-usput-ai-layer, proj-usput-retrieval-grounding
    text: >-
      A travel guide to Bosnia and Herzegovina with curated locations,
      experiences and audio tours, on Rails 8 with Hotwire, Solid Queue and
      Kamal, and AI content grounded in real places.
  - id: izbori
    name: Izbori 2026
    url: /politika/analiza-izbora/
    link_label: Open the guide
    thumb: /images/projects/izbori/thumb
    # evidence: files/_pages/politika.md
    text: >-
      A plain-language voter guide and seat projection for the 2026 general
      election in Bosnia and Herzegovina, covering all 7,028 candidates. The
      seat rules are written as code and replayed against 2018 and 2022, where
      they place every seat-winning list and mandate exactly.
  - id: treasurehunt
    name: hunt.rubyconf.at
    note: Built for RubyConf Austria 2026 · open source
    url: https://hunt.rubyconf.at
    link_label: Visit hunt.rubyconf.at
    profile: /projects/treasure-hunt/
    # evidence: proj-treasurehunt, proj-treasurehunt-features
    text: >-
      A location-based treasure hunt built for RubyConf Austria 2026: GPS
      proximity checks for each clue, team play, hints on cooldowns and live
      leaderboards, as an installable Rails 8.1 web app with an offline fallback.
      Now open source as <a href="https://github.com/Ruby-Austria/treasure_hunt">treasure_hunt</a>,
      ready for any conference organizer to rebrand and self-host.
  - id: card-game
    name: Post-Dayton BiH
    note: A political strategy card game
    url: /igre/dejtonska-igra/
    link_label: Play it
    profile: /projects/post-dayton/
    # evidence: proj-card-game, proj-card-game-tests, proj-card-game-adrs;
    # numbers from klosaer/card-game at c3aa816, 2026-10-22
    text: >-
      A card game with a pure TypeScript engine of about 110 modules, held by
      4,161 tests and 42 decision records that a pre-push hook keeps
      implemented.

  - id: minolovac
    name: Minolovac
    note: An educational minesweeper on real data
    url: /igre/minolovac/
    link_label: Play it
    thumb: /images/projects/minolovac/thumb
    # evidence: ~/projects/usput.ba/app/controllers/minesweeper_controller.rb
    text: >-
      A minesweeper on map grids across Bosnia and Herzegovina, where a cell is
      a mine when it touches a recorded mine-suspected area, and every game
      opens with a safe start. The same game runs in Usput.ba. It teaches what
      the numbers mean, and says plainly that an empty cell is never a safety
      statement.

