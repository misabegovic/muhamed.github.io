# Everything the homepage says. Edit the words here; the layout reads them.
# Every claim is taken from the evidence store in ~/projects/hireable
# (files/hireable/profile/muhamed.yml); the record id is noted beside it, so a
# claim can be checked, and changed when the evidence changes.
# A list left empty hides its section.

# The caption beside the portrait in the first screen.
person:
  role: Product engineer and technical lead, AI-native
  # A second line under the role, matching the LinkedIn headline's "| AI Engineer".
  credit: AI Engineer

hero:
  # evidence: summary-headline, role-carv-team, role-experfy-team, oss-pi-brain, oss-enola-constraints
  title: I build products and lead the teams that ship them.
  # The words of the title drawn with the highlighter. Must appear in the title exactly.
  highlight: ship them
  lead: >-
    Ten years of taking software from an idea to production, as a hands-on
    engineer and as a tech lead, for startups and established product
    companies alike. I also help teams become AI-native, with open-source
    tools I build and teach.
  # evidence: constraint-earliest-start, constraint-location
  availability: >-
    Available now for a senior role or contract work. Based in Vienna, working
    remotely across Europe.
  primary: { label: Get in touch, url: /contact/ }
  cv: { label: Download my CV, url: /cv/Muhamed_Isabegovic_CV.pdf }
  secondary: { label: See how I can help, url: "#services" }

# Three highlights on the homepage: the owner's own projects only.
highlights:
  - { anchor: usput, where: "AI Engineer, my own product", title: Usput.ba, line: A travel guide to Bosnia and Herzegovina, with AI content grounded in real places. }
  - { anchor: izbori, where: Side project, title: Izbori 2026, line: A voter guide and seat projection covering all 7,028 candidates. }
  - { anchor: treasurehunt, where: For RubyConf Austria, title: hunt.rubyconf.at, line: A location-based treasure hunt for conference attendees. }

# Things the owner made. Link when public; mark private when not.
side_projects:
  - id: usput
    name: Usput.ba
    note: AI Engineer, my own product
    logo: /images/logos/usput.png
    url: https://usput.ba
    link_label: Visit usput.ba
    # evidence: proj-usput-web, proj-usput-ai-layer, proj-usput-retrieval-grounding
    text: >-
      A travel guide to Bosnia and Herzegovina with curated locations,
      experiences and audio tours, on Rails 8 with Hotwire, Solid Queue and
      Kamal, and AI content grounded in real places.
  - id: izbori
    name: Izbori 2026
    url: /politika/analiza-izbora/
    link_label: Open the guide
    # evidence: files/_pages/politika.md
    text: >-
      A plain-language voter guide and seat projection for the 2026 general
      election in Bosnia and Herzegovina, covering all 7,028 candidates. The
      seat rules are written as code and replayed against 2018 and 2022, where
      they place every seat-winning list and mandate exactly.
  - id: treasurehunt
    name: hunt.rubyconf.at
    note: Built for RubyConf Austria 2026
    url: https://hunt.rubyconf.at
    link_label: Visit hunt.rubyconf.at
    # evidence: proj-treasurehunt, proj-treasurehunt-features
    text: >-
      A location-based treasure hunt built for RubyConf Austria 2026: GPS
      proximity checks for each clue, team play, hints on cooldowns and live
      leaderboards, as an installable Rails 8.1 web app with offline support.
  - id: card-game
    name: Post-Dayton BiH
    note: A political strategy card game
    url: /igre/dejtonska-igra/
    link_label: Play it
    # evidence: proj-card-game, proj-card-game-tests, proj-card-game-adrs
    text: >-
      A card game with a pure TypeScript engine of about 100 modules, held by
      3,374 tests and 33 decision records that a pre-push hook checks the code
      against.

  - id: minolovac
    name: Minolovac
    note: An educational minesweeper on real data
    url: /igre/minolovac/
    link_label: Play it
    # evidence: ~/projects/usput.ba/app/controllers/minesweeper_controller.rb
    text: >-
      A minesweeper on map grids across Bosnia and Herzegovina, where the mines
      sit exactly on recorded mine-suspected areas. It teaches what the numbers
      mean, and says plainly that an empty cell is never a safety statement.

