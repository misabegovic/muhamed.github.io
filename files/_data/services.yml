# The services page. Names, "when it fits", formats and summaries come from
# home.yml (services:), so the homepage and this page cannot drift. This file
# holds only the longer detail, keyed by service name. Each offer's email
# opens a prefilled message, like the contact page's cards (drafts, for the
# owner to adjust).
intro: >-
  Where teams usually start with me. They often overlap, and you can bring me
  something that fits none of them. Each starts from your code and how your
  team actually works, not from a slide deck.

details:
  Build:
    get:
      - A senior engineer who owns the work from spec to production, without a full-time hire.
      - Features built the way your codebase already works, with tests and a clean hand-over.
      - "AI features where they help your product: grounded in your data, with structured outputs and evals."
    email:
      label: Email about a build
      subject: A build for our team
      body: ["What we are building:", "Our stack:", "When we would like to start:"]
  Lead:
    get:
      - Technical direction and architecture decisions, written down so the team can follow them.
      - "Delivery that holds: planning, priorities and unblocking, together with product."
      - Support for your engineers, and help hiring the people you need next.
    email:
      label: Email about leading your team
      subject: A technical lead for our team
      body: ["The team and its size:", "What needs direction:", "How much of my time you need:"]
  Review:
    # The written review, part by part, in the order it is read. Built from
    # the earlier "What you get" lines; nothing added.
    delivers:
      title: What the review delivers
      parts:
        - { name: Where you stand, text: "A read of your codebase, your architecture and how your team works with it." }
        - { name: What holds, text: "The parts that will carry you as you grow." }
        - { name: What will break, text: "What will break as you grow, and where the risk sits." }
        - { name: What to fix first, text: "A prioritised plan, in order, which your team can act on." }
    email:
      label: Email about a review
      subject: An architecture review
      body: ["Our product and stack:", "What worries us about it:", "Any deadline:"]
  AI-native:
    get:
      - "A knowledge base your people and agents both work from: specs, decisions and architecture rules, across your whole development lifecycle."
      - Coding agents set up for your codebase, with guardrails they cannot bypass and architecture rules checked in CI.
      - "AI features in your product that hold up in production: grounded in your data, with structured outputs, evals and observability."
      - "Set up with the tools I build: enola and its gems today, tabula and taha as they ship, and taught to your team, with enola-guides as the reference."
    outcome: Your team ends up with a working setup in its own repositories, and knows how to keep it running.
    email:
      label: Email about going AI-native
      subject: Making our team AI-native
      body: ["What we build:", "How we use AI today:", "What we would like to change:"]

steps:
  title: How it works.
  items:
    - { step: Get in touch, text: "A few lines about your team and what you are trying to do." }
    - { step: A short call, text: "We talk it through, and I tell you honestly whether I can help." }
    - { step: A scoped proposal, text: "Clear deliverables, a format and a timeline, in writing." }
    - { step: The work, text: "I get to work, and keep you posted on what changed and what is next." }
  where: I work remotely from Vienna, and on site across the DACH region.

# The recommendations say why; the page's own claim stays one line. The
# quotes are the homepage's (home.yml testimonials), in the same order.
why:
  title: Why teams bring me in.
  text: I build and I lead, and the tools I teach are ones I wrote.
  link: { label: See the work behind this, url: /work/ }

closing:
  title: Tell me what you are trying to do.
  text: A few lines is enough. I will tell you honestly whether I can help, and how.
